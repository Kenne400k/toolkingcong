<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingCong Studio - AI TTS</title>
    <link rel="stylesheet" href="css/tts.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <script>
        tailwind.config = {
            darkMode: "class", 
            theme: {
                extend: {
                    colors: {
                        primary: "#a855f7", 
                        "bg-main": "#0a0a0a",
                        "bg-secondary": "#121212", 
                        "bg-tertiary": "#1a1a1a",
                        "border-dark": "#2a2a2a"
                    }, 
                    fontFamily: {
                        sans: ["Inter", "sans-serif"]
                    }
                }
            }
        };
    </script>
    
    <style>
        :root {
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --bg-main: #0a0a0a;
            --bg-secondary: #121212;
            --bg-tertiary: #1a1a1a;
            --border: #2a2a2a;
            --text: #e5e5e5;
            --text-dim: #888;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-main);
            color: var(--text);
        }
        
        .text-dim { color: var(--text-dim); }
        .bg-main { background: var(--bg-main); }
        .bg-secondary { background: var(--bg-secondary); }
        .border-custom { border-color: var(--border); }
        
        /* =================== SIDEBAR =================== */
        .avatar-wrapper {
            width: 40px; height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.3), rgba(168, 85, 247, 0.1));
            padding: 2px; flex-shrink: 0;
        }
        .avatar-inner {
            width: 100%; height: 100%;
            border-radius: 50%;
            background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .avatar-inner img { width: 100%; height: 100%; object-fit: cover; }
        
        .nav-link {
            position: relative; padding: 12px 16px;
            border-radius: 8px; cursor: pointer;
            text-decoration: none; transition: all 0.3s;
        }
        .nav-link::before {
            content: ''; position: absolute;
            left: 0; top: 50%; transform: translateY(-50%);
            width: 3px; height: 0;
            background: var(--primary); transition: height 0.3s;
        }
        .nav-link:hover { background: rgba(168, 85, 247, 0.08); }
        .nav-link.active { background: rgba(168, 85, 247, 0.12); color: var(--primary) !important; }
        .nav-link.active::before { height: 60%; }
        
        /* =================== MAIN LAYOUT =================== */
        .tts-container {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 24px;
            padding: 24px;
            height: calc(100vh - 64px);
            overflow: hidden;
        }
        
        /* =================== EDITOR =================== */
        .editor-panel {
            display: flex; flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .editor-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        
        .provider-selector {
            display: flex; gap: 8px;
        }
        .provider-btn {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer; transition: all 0.3s;
            font-size: 13px; font-weight: 500;
        }
        .provider-btn:hover { border-color: var(--primary); color: var(--text); }
        .provider-btn.active {
            background: rgba(168, 85, 247, 0.15);
            border-color: var(--primary);
            color: var(--primary);
        }
        
        .editor-stats {
            display: flex; gap: 16px; font-size: 13px; color: var(--text-dim);
        }
        
        .textarea-wrapper {
            flex: 1; position: relative; padding: 20px;
        }
        .textarea-wrapper textarea {
            width: 100%; height: 100%;
            background: transparent; border: none;
            color: var(--text); font-size: 15px;
            line-height: 1.7; resize: none; outline: none;
        }
        .textarea-wrapper textarea::placeholder { color: var(--text-dim); }
        
        #emptyState {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center; color: var(--text-dim);
            pointer-events: none;
        }
        #emptyState i { font-size: 48px; margin-bottom: 12px; }
        #emptyState.hidden { display: none; }
        
        .editor-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        
        .btn-upload {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-dim);
            cursor: pointer; transition: all 0.3s;
        }
        .btn-upload:hover { border-color: var(--primary); color: var(--text); }
        
        /* =================== SIDEBAR PANEL =================== */
        .settings-panel {
            display: flex; flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .panel-tabs {
            display: flex; border-bottom: 1px solid var(--border);
        }
        .tab-btn {
            flex: 1; padding: 14px;
            background: transparent; border: none;
            color: var(--text-dim);
            cursor: pointer; font-weight: 500;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        
        .panel-content {
            flex: 1; overflow-y: auto; padding: 20px;
        }
        .tab-content { display: none; }
        .tab-content.show { display: block; }
        
        /* =================== CONTROLS =================== */
        .control-group { margin-bottom: 20px; }
        .control-group label {
            display: block; margin-bottom: 8px;
            font-size: 13px; font-weight: 500; color: var(--text-dim);
        }
        
        .voice-selector {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer; transition: all 0.3s;
        }
        .voice-selector:hover { border-color: var(--primary); }
        .voice-selector img {
            width: 36px; height: 36px;
            border-radius: 50%; object-fit: cover;
        }
        .voice-selector img.hidden { display: none; }
        .voice-selector .placeholder-icon {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim);
        }
        
        select {
            width: 100%; padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 14px; outline: none;
            cursor: pointer;
        }
        select:focus { border-color: var(--primary); }
        
        .toggle-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 0;
        }
        .toggle-switch {
            position: relative; width: 44px; height: 24px;
        }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-switch .slider {
            position: absolute; inset: 0;
            background: var(--border);
            border-radius: 24px;
            cursor: pointer; transition: 0.3s;
        }
        .toggle-switch .slider::before {
            content: ''; position: absolute;
            width: 18px; height: 18px;
            left: 3px; bottom: 3px;
            background: white;
            border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch input:checked + .slider { background: var(--primary); }
        .toggle-switch input:checked + .slider::before { transform: translateX(20px); }
        
        /* =================== BUTTON =================== */
        .btn-primary {
            width: 100%; padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none; border-radius: 12px;
            color: white; font-weight: 600;
            cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(168, 85, 247, 0.3); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        
        /* =================== HISTORY =================== */
        .history-list { display: flex; flex-direction: column; gap: 12px; }
        
        .history-card {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        .hc-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 8px;
        }
        .hc-time { font-size: 12px; color: var(--text-dim); }
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px; font-weight: 600;
        }
        .status-badge.pending, .status-badge.processing, .status-badge.queued {
            background: rgba(251, 191, 36, 0.15); color: #fbbf24;
        }
        .status-badge.done { background: rgba(74, 222, 128, 0.15); color: #4ade80; }
        .status-badge.failed { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
        
        .hc-preview {
            font-size: 13px; color: var(--text-dim);
            margin-bottom: 12px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        
        .hc-footer {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 12px;
            border-top: 1px solid var(--border);
        }
        .credit-cost { font-size: 12px; color: var(--text-dim); }
        .btn-delete {
            background: transparent; border: none;
            color: var(--text-dim); cursor: pointer;
            padding: 6px;
        }
        .btn-delete:hover { color: #ef4444; }
        
        /* =================== AUDIO PLAYER =================== */
        .audio-player {
            display: flex; align-items: center; gap: 10px;
        }
        .play-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--primary);
            border: none; color: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .progress-track {
            flex: 1; height: 6px;
            background: var(--border);
            border-radius: 3px;
            cursor: pointer;
        }
        .progress-bar {
            height: 100%; width: 0;
            background: var(--primary);
            border-radius: 3px;
            transition: width 0.1s;
        }
        .timer { font-size: 12px; color: var(--text-dim); min-width: 36px; }
        .download-btn {
            padding: 8px; color: var(--text-dim);
            transition: color 0.3s;
        }
        .download-btn:hover { color: var(--primary); }
        
        .processing-status {
            display: flex; align-items: center; gap: 8px;
            color: var(--text-dim); font-size: 13px;
        }
        .error-msg { color: #ef4444; font-size: 13px; }
        
        .empty-history {
            text-align: center; padding: 40px 20px;
            color: var(--text-dim);
        }
        .empty-history i { font-size: 48px; margin-bottom: 12px; }
        
        /* =================== VOICE MODAL =================== */
        #voiceModal {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        #voiceModal.hidden { display: none; }
        
        .modal-content {
            width: 90%; max-width: 800px;
            max-height: 80vh;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            display: flex; flex-direction: column;
        }
        
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 { font-size: 18px; font-weight: 600; }
        .modal-close {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: none; color: var(--text-dim);
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text); }
        
        .modal-search {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-search input {
            width: 100%; padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            outline: none;
        }
        .modal-search input:focus { border-color: var(--primary); }
        
        .modal-body {
            flex: 1; overflow-y: auto; padding: 24px;
        }
        
        #voiceGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 16px;
        }
        
        .voice-card {
            background: var(--bg-tertiary);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .voice-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .voice-card.selected { border-color: var(--primary); background: rgba(168, 85, 247, 0.1); }
        
        .voice-avatar {
            position: relative;
            width: 64px; height: 64px;
            margin: 0 auto 12px;
        }
        .voice-avatar img {
            width: 100%; height: 100%;
            border-radius: 50%; object-fit: cover;
        }
        .preview-btn {
            position: absolute;
            bottom: -4px; right: -4px;
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--primary);
            border: 2px solid var(--bg-tertiary);
            color: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        
        .voice-info h4 {
            font-size: 14px; font-weight: 600;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .voice-tags {
            display: flex; flex-wrap: wrap; gap: 4px;
            justify-content: center;
        }
        .voice-tags .tag {
            padding: 2px 8px;
            background: var(--border);
            border-radius: 20px;
            font-size: 10px;
            color: var(--text-dim);
        }
        
        /* =================== LOADING =================== */
        #loadingOverlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none; align-items: center; justify-content: center;
            z-index: 2000;
        }
        #loadingOverlay.show { display: flex; }
        
        .spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .animate-fadeIn {
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Hidden file input */
        #fileInput { display: none; }
    </style>
</head>
<body class="bg-main">

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="flex h-screen w-full overflow-hidden">
        
        <!-- =================== SIDEBAR =================== -->
        <aside class="w-64 flex flex-col border-r border-custom bg-main hidden md:flex shrink-0">
            <div class="flex flex-col h-full p-4">
                
                <!-- User Info -->
                <div class="flex gap-3 items-center p-3 mb-6">
                    <div class="avatar-wrapper">
                        <div class="avatar-inner" id="user-avatar">
                            <span class="text-sm font-bold text-white">K</span>
                        </div>
                    </div>
                    <div class="flex flex-col min-w-0 flex-1">
                        <h1 class="text-white text-sm font-semibold truncate" id="user-name">VoiceStudio</h1>
                        <p class="text-dim text-xs">Pro Plan</p>
                    </div>
                </div>
                
                <!-- Navigation -->
                <nav class="flex flex-col gap-1 flex-1">
                    <a class="nav-link flex items-center gap-3 text-sm font-medium text-dim" data-page="dashboard">
                        <span class="material-symbols-outlined text-xl">dashboard</span>
                        <span>Dashboard</span>
                    </a>
                    <a class="nav-link active flex items-center gap-3 text-sm font-medium" data-page="tts">
                        <span class="material-symbols-outlined text-xl">mic</span>
                        <span>TTS Tool</span>
                    </a>
                    <a class="nav-link flex items-center gap-3 text-sm font-medium text-dim" data-page="history">
                        <span class="material-symbols-outlined text-xl">history</span>
                        <span>History</span>
                    </a>
                    
                    <div class="mt-auto pt-4 border-t border-custom">
                        <a class="nav-link flex items-center gap-3 text-sm font-medium text-dim" id="logout-btn">
                            <span class="material-symbols-outlined text-xl">logout</span>
                            <span>Logout</span>
                        </a>
                    </div>
                </nav>
            </div>
        </aside>
        
        <!-- =================== MAIN CONTENT =================== -->
        <main class="flex-1 flex flex-col h-full overflow-hidden bg-main">
            
            <!-- Header -->
            <header class="h-16 flex items-center justify-between border-b border-custom px-6 bg-main shrink-0">
                <h2 class="text-white text-lg font-semibold">TTS Tool</h2>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 bg-secondary px-4 py-2 rounded-lg border border-custom">
                        <span class="material-symbols-outlined text-primary text-lg">account_balance_wallet</span>
                        <span class="text-sm font-semibold text-white" id="header-credits">0</span>
                        <span class="text-xs text-dim">Credits</span>
                    </div>
                    <span class="text-sm text-dim hidden sm:block" id="header-email">Loading...</span>
                </div>
            </header>

            <!-- TTS Container -->
            <div class="tts-container">
                
                <!-- Editor Panel -->
                <div class="editor-panel">
                    <div class="editor-toolbar">
                        <div class="provider-selector">
                            <button class="provider-btn active" data-provider="minimax" onclick="switchProvider('minimax')">
                                Minimax
                            </button>
                            <button class="provider-btn" data-provider="elevenlabs" onclick="switchProvider('elevenlabs')">
                                ElevenLabs
                            </button>
                        </div>
                        <div class="editor-stats">
                            <span id="charCount">0 ký tự</span>
                            <span>|</span>
                            <span id="estimatedCost">~0 credits</span>
                            <span>|</span>
                            <span id="estimatedDuration">~0s</span>
                        </div>
                    </div>
                    
                    <div class="textarea-wrapper">
                        <textarea id="txtInput" placeholder="Nhập văn bản vào đây để bắt đầu chuyển đổi..."></textarea>
                        <div id="emptyState">
                            <i class="bi bi-keyboard"></i>
                            <p>Bắt đầu nhập liệu hoặc tải file lên...</p>
                        </div>
                    </div>
                    
                    <div class="editor-footer">
                        <button class="btn-upload" onclick="openFileUpload()">
                            <i class="bi bi-cloud-upload"></i>
                            <span>Tải file (.txt, .srt)</span>
                        </button>
                        <input type="file" id="fileInput" accept=".txt,.srt">
                    </div>
                </div>
                
                <!-- Settings Panel -->
                <div class="settings-panel">
                    <div class="panel-tabs">
                        <button class="tab-btn active" data-tab="settings" onclick="switchTab('settings')">Cài đặt</button>
                        <button class="tab-btn" data-tab="history" onclick="switchTab('history')">Lịch sử</button>
                    </div>
                    
                    <div class="panel-content">
                        <!-- Settings Tab -->
                        <div id="tabSettings" class="tab-content show">
                            
                            <!-- Voice Selection -->
                            <div class="control-group">
                                <label>Giọng đọc</label>
                                <div class="voice-selector" onclick="openVoiceModal()">
                                    <img id="selectedVoiceAvatar" src="" alt="" class="hidden">
                                    <div class="placeholder-icon">
                                        <i class="bi bi-person"></i>
                                    </div>
                                    <div class="flex-1">
                                        <span id="selectedVoiceName">Chọn giọng đọc...</span>
                                    </div>
                                    <i class="bi bi-chevron-right text-dim"></i>
                                </div>
                            </div>
                            
                            <!-- Model Selection -->
                            <div class="control-group">
                                <label>Mô hình (Model)</label>
                                <select id="modelSelect">
                                    <option>Đang tải...</option>
                                </select>
                            </div>
                            
                            <!-- SRT Toggle -->
                            <div class="control-group">
                                <div class="toggle-row">
                                    <span>Tạo phụ đề (SRT)</span>
                                    <label class="toggle-switch">
                                        <input type="checkbox" id="srtCheckbox">
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>
                            
                            <!-- Generate Button -->
                            <div class="control-group" style="margin-top: auto; padding-top: 20px;">
                                <button class="btn-primary" id="btnProcess" onclick="startTTS()">
                                    <i class="bi bi-soundwave"></i>
                                    <span>CHUYỂN ĐỔI NGAY</span>
                                </button>
                            </div>
                        </div>
                        
                        <!-- History Tab -->
                        <div id="tabHistory" class="tab-content">
                            <div class="history-list" id="historyList">
                                <div class="empty-history">
                                    <i class="bi bi-inbox"></i>
                                    <p>Chưa có lịch sử</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Voice Modal -->
    <div id="voiceModal" class="hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Chọn giọng đọc</h3>
                <button class="modal-close" onclick="closeVoiceModal()">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <div class="modal-search">
                <input type="text" id="voiceSearch" placeholder="Tìm kiếm giọng nói...">
            </div>
            <div class="modal-body">
                <div id="voiceGrid">
                    <!-- Voices will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/api-handler.js"></script>
