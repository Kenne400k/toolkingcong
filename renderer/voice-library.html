<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Voice Library - KingCong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #a855f7;
            --bg-main: #0a0a0a;
            --bg-secondary: #050505;
            --border: #1a1a1a;
            --text: #e5e5e5;
            --text-dim: #888;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        body {
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #555;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover { color: #fff; }

        /* Tabs with logos */
        .tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
            padding: 0 16px;
            gap: 8px;
        }

        .lib-tab {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .lib-tab:hover { color: #ccc; }

        .lib-tab.active {
            color: #fff;
            border-bottom: 2px solid var(--primary);
        }

        .lib-tab img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .info-text {
            font-size: 11px;
            color: #666;
            line-height: 1.6;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .info-text code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #fff;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: #fff;
        }

        .btn:hover { background: #111; border-color: #333; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #fff; color: #000; border: none; }
        .btn-primary:hover { background: #e5e5e5; }
        .btn-sm { padding: 5px 8px; font-size: 10px; }
        .btn-sm i { font-size: 12px; }

        .library-content { display: none; }
        .library-content.active { display: block; }

        .voice-table {
            width: 100%;
            border-collapse: collapse;
        }

        .voice-table th, .voice-table td {
            padding: 8px 6px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        .voice-table th {
            color: #555;
            font-weight: 500;
            font-size: 9px;
            text-transform: uppercase;
            background: var(--bg-secondary);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .voice-table input {
            padding: 6px 8px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }

        .voice-table input:focus { outline: none; border-color: #444; }
        .voice-table input[type="number"] { text-align: center; }
        .voice-table input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

        .voice-table select {
            padding: 6px 8px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
        }

        .voice-table select:focus { outline: none; border-color: #444; }

        .voice-table tr:hover td { background: var(--bg-main); }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #555;
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            display: block;
            margin-bottom: 16px;
        }

        /* Hidden audio */
        #previewAudio { display: none; }
    </style>
</head>

<body>
    <div class="modal-header">
        <h3><i class="bi bi-collection"></i> Voice Library</h3>
        <button class="modal-close" onclick="window.close()">×</button>
    </div>

    <!-- Tabs with logos -->
    <div class="tabs">
        <button class="lib-tab active" data-provider="elevenlabs" onclick="switchTab('elevenlabs')">
            <img src="https://help.elevenlabs.io/hc/theming_assets/01HZQ08B6SDY5X53YN9ABG4B99" alt="">
            <span>ElevenLabs</span>
        </button>
        <button class="lib-tab" data-provider="minimax" onclick="switchTab('minimax')">
            <img src="https://registry.npmmirror.com/@lobehub/icons-static-png/latest/files/dark/minimax-color.png" alt="">
            <span>Minimax</span>
        </button>
    </div>

    <div class="modal-body">
        <div class="info-text">
            Dùng <code>#1</code> <code>#2</code> <code>#3</code> đầu mỗi dòng để dùng voice tương ứng cho hội thoại nhiều người.
        </div>

        <!-- ElevenLabs Library -->
        <div id="elevenlabsLibrary" class="library-content active">
            <table class="voice-table">
                <thead>
                    <tr>
                        <th style="width: 40px;">#</th>
                        <th style="width: 80px;">Project</th>
                        <th style="min-width: 100px;">Name</th>
                        <th style="min-width: 160px;">Voice ID</th>
                        <th style="min-width: 110px;">Model</th>
                        <th style="width: 60px;">Speed</th>
                        <th style="width: 65px;">Stability</th>
                        <th style="width: 65px;">Similarity</th>
                        <th style="width: 55px;">Style</th>
                        <th style="width: 45px;">Boost</th>
                        <th style="width: 90px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="elevenlabsLibraryBody"></tbody>
            </table>
        </div>

        <!-- Minimax Library -->
        <div id="minimaxLibrary" class="library-content">
            <table class="voice-table">
                <thead>
                    <tr>
                        <th style="width: 40px;">#</th>
                        <th style="width: 80px;">Project</th>
                        <th style="min-width: 100px;">Name</th>
                        <th style="min-width: 160px;">Voice ID</th>
                        <th style="min-width: 110px;">Model</th>
                        <th style="width: 60px;">Speed</th>
                        <th style="width: 60px;">Pitch</th>
                        <th style="width: 60px;">Volume</th>
                        <th style="width: 90px;">Actions</th>
                    </tr>
                </thead>
                <tbody id="minimaxLibraryBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-footer">
        <button class="btn" onclick="window.close()">Cancel</button>
        <button class="btn btn-primary" onclick="saveAndClose()"><i class="bi bi-save"></i> Save</button>
    </div>

    <audio id="previewAudio"></audio>

    <script>
        let elevenlabsVoices = [];
        let minimaxVoices = [];
        let currentTab = 'elevenlabs';
        const previewAudio = document.getElementById('previewAudio');

        function init() {
            // Load ElevenLabs voices
            try {
                elevenlabsVoices = JSON.parse(localStorage.getItem('voiceLibrary_elevenlabs') || '[]');
                if (!Array.isArray(elevenlabsVoices)) elevenlabsVoices = [];
            } catch(e) { elevenlabsVoices = []; }

            // Load Minimax voices
            try {
                minimaxVoices = JSON.parse(localStorage.getItem('voiceLibrary_minimax') || '[]');
                if (!Array.isArray(minimaxVoices)) minimaxVoices = [];
            } catch(e) { minimaxVoices = []; }

            renderElevenlabsLibrary();
            renderMinimaxLibrary();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.lib-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.provider === tab);
            });
            document.querySelectorAll('.library-content').forEach(content => {
                content.classList.toggle('active', content.id === tab + 'Library');
            });
        }

        function renderElevenlabsLibrary() {
            const tbody = document.getElementById('elevenlabsLibraryBody');

            if (!elevenlabsVoices || elevenlabsVoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state"><i class="bi bi-collection"></i><p>Chưa có voice nào</p></div></td></tr>`;
                return;
            }

            tbody.innerHTML = elevenlabsVoices.map((voice, idx) => `
                <tr data-idx="${idx}">
                    <td>${idx + 1}</td>
                    <td><input type="text" value="${voice.project || ''}" placeholder="Project..." style="width: 70px;" onchange="updateElevenlabsVoice(${idx}, 'project', this.value)"></td>
                    <td><input type="text" value="${escapeHtml(voice.name || '')}" placeholder="Name..." style="width: 90px;" onchange="updateElevenlabsVoice(${idx}, 'name', this.value)"></td>
                    <td><input type="text" value="${voice.voiceId || ''}" placeholder="Voice ID..." style="width: 140px;" onchange="updateElevenlabsVoice(${idx}, 'voiceId', this.value)"></td>
                    <td>
                        <select style="width: 110px;" onchange="updateElevenlabsVoice(${idx}, 'model', this.value)">
                            <option value="eleven_v3" ${voice.model === 'eleven_v3' ? 'selected' : ''}>Eleven V3</option>
                            <option value="eleven_multilingual_v2" ${voice.model === 'eleven_multilingual_v2' ? 'selected' : ''}>Multilingual V2</option>
                            <option value="eleven_turbo_v2_5" ${voice.model === 'eleven_turbo_v2_5' ? 'selected' : ''}>Turbo V2.5</option>
                            <option value="eleven_turbo_v2" ${voice.model === 'eleven_turbo_v2' ? 'selected' : ''}>Turbo V2</option>
                            <option value="eleven_flash_v2_5" ${voice.model === 'eleven_flash_v2_5' ? 'selected' : ''}>Flash V2.5</option>
                            <option value="eleven_flash_v2" ${voice.model === 'eleven_flash_v2' ? 'selected' : ''}>Flash V2</option>
                            <option value="eleven_monolingual_v1" ${voice.model === 'eleven_monolingual_v1' ? 'selected' : ''}>Monolingual V1</option>
                        </select>
                    </td>
                    <td><input type="number" value="${voice.settings?.speed || 1}" step="0.1" min="0.5" max="2" style="width: 50px;" onchange="updateElevenlabsSetting(${idx}, 'speed', parseFloat(this.value))"></td>
                    <td><input type="number" value="${voice.settings?.stability || 0.5}" step="0.1" min="0" max="1" style="width: 55px;" onchange="updateElevenlabsSetting(${idx}, 'stability', parseFloat(this.value))"></td>
                    <td><input type="number" value="${voice.settings?.similarity || 0.75}" step="0.1" min="0" max="1" style="width: 55px;" onchange="updateElevenlabsSetting(${idx}, 'similarity', parseFloat(this.value))"></td>
                    <td><input type="number" value="${voice.settings?.style || 0}" step="0.1" min="0" max="1" style="width: 45px;" onchange="updateElevenlabsSetting(${idx}, 'style', parseFloat(this.value))"></td>
                    <td style="text-align: center;"><input type="checkbox" ${voice.settings?.speakerBoost !== false ? 'checked' : ''} onchange="updateElevenlabsSetting(${idx}, 'speakerBoost', this.checked)"></td>
                    <td style="display: flex; gap: 4px;">
                        <button class="btn btn-sm" onclick="previewVoice('elevenlabs', ${idx})" title="Nghe thử"><i class="bi bi-volume-up"></i></button>
                        <button class="btn btn-sm" onclick="useVoice('elevenlabs', ${idx})" title="Sử dụng"><i class="bi bi-check-lg"></i></button>
                        <button class="btn btn-sm" onclick="removeVoice('elevenlabs', ${idx})" title="Xóa" style="color: #f55;"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function renderMinimaxLibrary() {
            const tbody = document.getElementById('minimaxLibraryBody');

            if (!minimaxVoices || minimaxVoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="bi bi-collection"></i><p>Chưa có voice nào</p></div></td></tr>`;
                return;
            }

            tbody.innerHTML = minimaxVoices.map((voice, idx) => `
                <tr data-idx="${idx}">
                    <td>${idx + 1}</td>
                    <td><input type="text" value="${voice.project || ''}" placeholder="Project..." style="width: 70px;" onchange="updateMinimaxVoice(${idx}, 'project', this.value)"></td>
                    <td><input type="text" value="${escapeHtml(voice.name || '')}" placeholder="Name..." style="width: 90px;" onchange="updateMinimaxVoice(${idx}, 'name', this.value)"></td>
                    <td><input type="text" value="${voice.voiceId || ''}" placeholder="Voice ID..." style="width: 140px;" onchange="updateMinimaxVoice(${idx}, 'voiceId', this.value)"></td>
                    <td>
                        <select style="width: 100px;" onchange="updateMinimaxVoice(${idx}, 'model', this.value)">
                            <option value="speech-02-hd" ${voice.model === 'speech-02-hd' ? 'selected' : ''}>Speech HD 2.6</option>
                            <option value="speech-02-turbo" ${voice.model === 'speech-02-turbo' ? 'selected' : ''}>Speech Turbo 2.6</option>
                            <option value="speech-01-hd" ${voice.model === 'speech-01-hd' ? 'selected' : ''}>Speech HD 2.5</option>
                            <option value="speech-01-turbo" ${voice.model === 'speech-01-turbo' ? 'selected' : ''}>Speech Turbo 2.5</option>
                        </select>
                    </td>
                    <td><input type="number" value="${voice.settings?.speed || 1}" step="0.1" min="0.5" max="2" style="width: 50px;" onchange="updateMinimaxSetting(${idx}, 'speed', parseFloat(this.value))"></td>
                    <td><input type="number" value="${voice.settings?.pitch || 0}" step="1" min="-12" max="12" style="width: 50px;" onchange="updateMinimaxSetting(${idx}, 'pitch', parseFloat(this.value))"></td>
                    <td><input type="number" value="${voice.settings?.vol || 1}" step="0.1" min="0.1" max="10" style="width: 50px;" onchange="updateMinimaxSetting(${idx}, 'vol', parseFloat(this.value))"></td>
                    <td style="display: flex; gap: 4px;">
                        <button class="btn btn-sm" onclick="previewVoice('minimax', ${idx})" title="Nghe thử"><i class="bi bi-volume-up"></i></button>
                        <button class="btn btn-sm" onclick="useVoice('minimax', ${idx})" title="Sử dụng"><i class="bi bi-check-lg"></i></button>
                        <button class="btn btn-sm" onclick="removeVoice('minimax', ${idx})" title="Xóa" style="color: #f55;"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function updateElevenlabsVoice(idx, field, value) {
            if (elevenlabsVoices[idx]) elevenlabsVoices[idx][field] = value;
        }

        function updateElevenlabsSetting(idx, field, value) {
            if (elevenlabsVoices[idx]) {
                if (!elevenlabsVoices[idx].settings) elevenlabsVoices[idx].settings = {};
                elevenlabsVoices[idx].settings[field] = value;
            }
        }

        function updateMinimaxVoice(idx, field, value) {
            if (minimaxVoices[idx]) minimaxVoices[idx][field] = value;
        }

        function updateMinimaxSetting(idx, field, value) {
            if (minimaxVoices[idx]) {
                if (!minimaxVoices[idx].settings) minimaxVoices[idx].settings = {};
                minimaxVoices[idx].settings[field] = value;
            }
        }

        async function previewVoice(provider, idx) {
            const voices = provider === 'elevenlabs' ? elevenlabsVoices : minimaxVoices;
            const voice = voices[idx];
            if (!voice) return;

            let previewUrl = voice.preview_url || '';

            if (!previewUrl && voice.voiceId) {
                try {
                    const res = await window.electronAPI.apiRequest(
                        'https://kingcongstudio.com/ajaxs/get_resources2.php?action=search_voice_id',
                        { voice_id: voice.voiceId }
                    );
                    if (res && res.status === 'success' && res.data) {
                        previewUrl = res.data.preview_url || res.data.sample_audio || '';
                        if (previewUrl) voice.preview_url = previewUrl;
                    }
                } catch(e) {}
            }

            if (!previewUrl) {
                alert('Không có audio mẫu!');
                return;
            }

            if (previewAudio.src === previewUrl && !previewAudio.paused) {
                previewAudio.pause();
            } else {
                previewAudio.src = previewUrl;
                previewAudio.play().catch(e => alert('Không thể phát audio!'));
            }
        }

        function useVoice(provider, idx) {
            const voices = provider === 'elevenlabs' ? elevenlabsVoices : minimaxVoices;
            const voice = voices[idx];
            if (!voice || !voice.voiceId) return;

            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'useVoiceFromLibrary', voice: voice }, '*');
            }

            if (window.electronAPI && window.electronAPI.sendVoiceLibrary) {
                window.electronAPI.sendVoiceLibrary({ action: 'use', voice: voice });
            }
        }

        function removeVoice(provider, idx) {
            if (!confirm('Xóa voice này?')) return;

            if (provider === 'elevenlabs') {
                elevenlabsVoices.splice(idx, 1);
                renderElevenlabsLibrary();
            } else {
                minimaxVoices.splice(idx, 1);
                renderMinimaxLibrary();
            }
        }

        function saveAndClose() {
            localStorage.setItem('voiceLibrary_elevenlabs', JSON.stringify(elevenlabsVoices));
            localStorage.setItem('voiceLibrary_minimax', JSON.stringify(minimaxVoices));

            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'voiceLibraryUpdated',
                    elevenlabs: elevenlabsVoices,
                    minimax: minimaxVoices
                }, '*');
            }

            if (window.electronAPI && window.electronAPI.sendVoiceLibrary) {
                window.electronAPI.sendVoiceLibrary({
                    elevenlabs: elevenlabsVoices,
                    minimax: minimaxVoices
                });
            }

            window.close();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Listen for voice library updates
        if (window.electronAPI && window.electronAPI.onVoiceLibraryUpdated) {
            window.electronAPI.onVoiceLibraryUpdated((data) => {
                if (data.action === 'added' && data.voice) {
                    if (data.provider === 'elevenlabs') {
                        elevenlabsVoices.push(data.voice);
                        renderElevenlabsLibrary();
                    } else if (data.provider === 'minimax') {
                        minimaxVoices.push(data.voice);
                        renderMinimaxLibrary();
                    }
                }
            });
        }

        init();
    </script>
</body>
</html>
