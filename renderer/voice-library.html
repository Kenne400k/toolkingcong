<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Voice Library - KingCong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #a855f7;
            --bg-main: #0a0a0a;
            --bg-secondary: #121212;
            --border: #2a2a2a;
            --text: #e5e5e5;
            --text-dim: #888;
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        body {
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 16px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header h1 i { color: var(--primary); }

        .info-box {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 11px;
            color: var(--text-dim);
            line-height: 1.5;
        }

        .info-box code {
            background: #1a1a1a;
            padding: 2px 5px;
            border-radius: 3px;
            color: #fff;
        }

        .table-container {
            max-height: calc(100vh - 220px);
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 6px;
        }

        .voice-table {
            width: max-content;
            min-width: 100%;
            border-collapse: collapse;
            background: #0a0a0a;
        }

        .voice-table th {
            background: #111;
            text-align: left;
            padding: 10px 8px;
            font-size: 9px;
            font-weight: 600;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .voice-table td {
            padding: 8px 6px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 11px;
            white-space: nowrap;
        }

        .voice-table tr:hover td { background: #0f0f0f; }

        .voice-table input, .voice-table select {
            padding: 5px 6px;
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            color: #fff;
            font-size: 10px;
            outline: none;
        }

        .voice-table input:focus, .voice-table select:focus { border-color: #444; }
        .voice-table input:disabled, .voice-table select:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #050505;
        }

        .input-voiceid { width: 200px; }
        .input-name { width: 100px; }
        .input-project { width: 80px; }
        .input-model { width: 130px; }
        .input-num { width: 55px; text-align: center; }
        .input-provider { width: 90px; }

        .btn {
            padding: 7px 12px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            border: 1px solid #1a1a1a;
            background: #0a0a0a;
            color: #fff;
        }

        .btn:hover { background: #111; border-color: #333; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #fff; color: #000; border: none; }
        .btn-primary:hover { background: #e5e5e5; }
        .btn-success { background: #10b981; color: #fff; border: none; }
        .btn-success:hover { background: #059669; }
        .btn-danger { color: #f55; }
        .btn-danger:hover { background: rgba(255, 85, 85, 0.1); border-color: #f55; }
        .btn-sm { padding: 4px 7px; font-size: 10px; }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .actions-left { display: flex; gap: 8px; }
        .actions-right { margin-left: auto; display: flex; gap: 8px; }

        .checkbox-cell {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-cell input[type="checkbox"] {
            width: 14px;
            height: 14px;
            cursor: pointer;
        }

        .v3-notice {
            font-size: 9px;
            color: #f59e0b;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1><i class="bi bi-collection"></i> Voice Library</h1>
        <span style="font-size: 11px; color: #555;">Quản lý giọng nói</span>
    </div>

    <div class="info-box">
        <strong>Hướng dẫn:</strong> Lưu Voice ID cùng settings. Dùng <code>#1</code> <code>#2</code> <code>#3</code> ở đầu dòng để chỉ định giọng.
        <span style="color: #f59e0b;">Model V3 chỉ hỗ trợ Stability.</span>
    </div>

    <div class="table-container">
        <table class="voice-table" id="voiceTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Provider</th>
                    <th>Voice ID</th>
                    <th>Name</th>
                    <th>Project</th>
                    <th>Model</th>
                    <th>Speed</th>
                    <th>Stability</th>
                    <th>Similarity</th>
                    <th>Style</th>
                    <th>Boost</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="voiceTableBody">
                <!-- Rows will be added dynamically -->
            </tbody>
        </table>
    </div>

    <div class="actions">
        <div class="actions-left">
            <button class="btn" onclick="addVoiceRow()">
                <i class="bi bi-plus"></i> Thêm Voice
            </button>
            <button class="btn btn-danger" onclick="clearAll()">
                <i class="bi bi-trash"></i> Xóa tất cả
            </button>
        </div>
        <div class="actions-right">
            <button class="btn" onclick="window.close()">Đóng</button>
            <button class="btn btn-primary" onclick="saveAndClose()">
                <i class="bi bi-check"></i> Lưu
            </button>
        </div>
    </div>

    <script>
        let voices = [];

        const ELEVENLABS_MODELS = [
            { id: 'eleven_multilingual_v2', name: 'Multilingual V2' },
            { id: 'eleven_turbo_v2_5', name: 'Turbo V2.5' },
            { id: 'eleven_flash_v2', name: 'Flash V2' },
            { id: 'eleven_flash_v2_5', name: 'Flash V2.5' },
            { id: 'eleven_v3', name: 'Eleven V3 (Alpha)' }
        ];

        const MINIMAX_MODELS = [
            { id: 'speech-02-hd', name: 'Speech HD 2.6' },
            { id: 'speech-02-turbo', name: 'Speech Turbo 2.6' },
            { id: 'speech-01-hd', name: 'Speech HD 2.5' },
            { id: 'speech-01-turbo', name: 'Speech Turbo 2.5' }
        ];

        function isModelV3(model) {
            return model === 'eleven_v3';
        }

        // Load voices from localStorage on init
        function init() {
            const saved = localStorage.getItem('voiceLibrary');
            if (saved) {
                try {
                    voices = JSON.parse(saved);
                } catch(e) {
                    voices = [];
                }
            }

            // Ensure at least one empty row
            if (voices.length === 0) {
                voices = [createEmptyVoice()];
            }

            renderTable();
        }

        function createEmptyVoice() {
            return {
                id: Date.now(),
                voiceId: '',
                name: '',
                provider: 'elevenlabs',
                project: '',
                model: 'eleven_multilingual_v2',
                settings: {
                    speed: 1.0,
                    stability: 0.5,
                    similarity: 0.75,
                    style: 0,
                    speakerBoost: true,
                    // Minimax settings
                    pitch: 0,
                    volume: 1.0
                }
            };
        }

        function renderTable() {
            const tbody = document.getElementById('voiceTableBody');
            tbody.innerHTML = voices.map((voice, index) => {
                const isElevenlabs = voice.provider === 'elevenlabs';
                const isV3 = isModelV3(voice.model);
                const models = isElevenlabs ? ELEVENLABS_MODELS : MINIMAX_MODELS;

                // Get current values
                const speed = voice.settings?.speed ?? 1.0;
                const stability = voice.settings?.stability ?? 0.5;
                const similarity = voice.settings?.similarity ?? 0.75;
                const style = voice.settings?.style ?? 0;
                const speakerBoost = voice.settings?.speakerBoost !== false;

                return `
                <tr data-index="${index}">
                    <td style="color: #666; text-align: center; width: 30px;">${index + 1}</td>
                    <td>
                        <select class="input-provider" onchange="updateProvider(${index}, this.value)">
                            <option value="elevenlabs" ${voice.provider === 'elevenlabs' ? 'selected' : ''}>ElevenLabs</option>
                            <option value="minimax" ${voice.provider === 'minimax' ? 'selected' : ''}>Minimax</option>
                        </select>
                    </td>
                    <td>
                        <input type="text" class="input-voiceid"
                               value="${escapeHtml(voice.voiceId || '')}"
                               placeholder="Voice ID..."
                               onchange="updateVoice(${index}, 'voiceId', this.value)">
                    </td>
                    <td>
                        <input type="text" class="input-name"
                               value="${escapeHtml(voice.name || '')}"
                               placeholder="Tên..."
                               onchange="updateVoice(${index}, 'name', this.value)">
                    </td>
                    <td>
                        <input type="text" class="input-project"
                               value="${escapeHtml(voice.project || '')}"
                               placeholder="Project..."
                               onchange="updateVoice(${index}, 'project', this.value)">
                    </td>
                    <td>
                        <select class="input-model" onchange="updateModel(${index}, this.value)" ${!isElevenlabs ? 'style="display:none;"' : ''}>
                            ${ELEVENLABS_MODELS.map(m => `<option value="${m.id}" ${voice.model === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
                        </select>
                        <select class="input-model" onchange="updateModel(${index}, this.value)" ${isElevenlabs ? 'style="display:none;"' : ''}>
                            ${MINIMAX_MODELS.map(m => `<option value="${m.id}" ${voice.model === m.id ? 'selected' : ''}>${m.name}</option>`).join('')}
                        </select>
                    </td>
                    <td>
                        <input type="number" class="input-num"
                               value="${speed}"
                               step="0.1" min="0.5" max="2"
                               ${isV3 ? 'disabled title="V3 không hỗ trợ Speed"' : ''}
                               onchange="updateSetting(${index}, 'speed', parseFloat(this.value))">
                    </td>
                    <td>
                        <input type="number" class="input-num"
                               value="${stability}"
                               step="0.05" min="0" max="1"
                               onchange="updateSetting(${index}, 'stability', parseFloat(this.value))">
                    </td>
                    <td>
                        <input type="number" class="input-num"
                               value="${similarity}"
                               step="0.05" min="0" max="1"
                               ${isV3 ? 'disabled title="V3 không hỗ trợ Similarity"' : ''}
                               onchange="updateSetting(${index}, 'similarity', parseFloat(this.value))">
                    </td>
                    <td>
                        <input type="number" class="input-num"
                               value="${style}"
                               step="0.05" min="0" max="1"
                               ${isV3 ? 'disabled title="V3 không hỗ trợ Style"' : ''}
                               onchange="updateSetting(${index}, 'style', parseFloat(this.value))">
                    </td>
                    <td class="checkbox-cell">
                        <input type="checkbox"
                               ${speakerBoost ? 'checked' : ''}
                               ${isV3 ? 'disabled title="V3 không hỗ trợ Speaker Boost"' : ''}
                               onchange="updateSetting(${index}, 'speakerBoost', this.checked)">
                    </td>
                    <td style="text-align: center;">
                        <button class="btn btn-sm btn-success" onclick="useVoice(${index})" title="Sử dụng">
                            <i class="bi bi-check-lg"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="removeVoice(${index})" title="Xóa">
                            <i class="bi bi-x"></i>
                        </button>
                    </td>
                </tr>
            `}).join('');
        }

        function addVoiceRow() {
            voices.push(createEmptyVoice());
            renderTable();

            // Focus on the new row's Voice ID input
            setTimeout(() => {
                const inputs = document.querySelectorAll('#voiceTableBody tr:last-child input.input-voiceid');
                if (inputs[0]) inputs[0].focus();
            }, 50);
        }

        function updateVoice(index, field, value) {
            if (voices[index]) {
                voices[index][field] = value;
            }
        }

        function updateProvider(index, value) {
            if (voices[index]) {
                voices[index].provider = value;
                // Reset model when switching provider
                if (value === 'elevenlabs') {
                    voices[index].model = 'eleven_multilingual_v2';
                } else {
                    voices[index].model = 'speech-02-hd';
                }
                renderTable();
            }
        }

        function updateModel(index, value) {
            if (voices[index]) {
                voices[index].model = value;
                renderTable(); // Re-render to update disabled states
            }
        }

        function updateSetting(index, field, value) {
            if (voices[index]) {
                if (!voices[index].settings) {
                    voices[index].settings = {};
                }
                voices[index].settings[field] = value;
            }
        }

        function removeVoice(index) {
            if (voices.length <= 1) {
                voices = [createEmptyVoice()];
            } else {
                voices.splice(index, 1);
            }
            renderTable();
        }

        function useVoice(index) {
            const voice = voices[index];
            if (!voice || !voice.voiceId) {
                alert('Voice ID is empty!');
                return;
            }

            // Send voice data to parent window
            const voiceData = {
                type: 'useVoiceFromLibrary',
                voice: voice
            };

            // Notify parent via postMessage
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage(voiceData, '*');
            }

            // Also use IPC if available
            if (window.electronAPI && window.electronAPI.sendVoiceLibrary) {
                window.electronAPI.sendVoiceLibrary({ action: 'use', voice: voice });
            }

            alert(`Đang sử dụng: ${voice.name || voice.voiceId}`);
        }

        function clearAll() {
            if (confirm('Xóa tất cả voices trong thư viện?')) {
                voices = [createEmptyVoice()];
                renderTable();
            }
        }

        function saveAndClose() {
            // Filter out empty rows
            const validVoices = voices.filter(v => v.voiceId && v.voiceId.trim());

            // Save to localStorage
            localStorage.setItem('voiceLibrary', JSON.stringify(validVoices));

            // Notify parent window
            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'voiceLibraryUpdated', voices: validVoices }, '*');
            }

            // Also use IPC if available
            if (window.electronAPI) {
                window.electronAPI.sendVoiceLibrary(validVoices);
            }

            window.close();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Initialize
        init();
    </script>
</body>
</html>
