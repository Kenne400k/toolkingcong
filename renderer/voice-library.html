<!DOCTYPE html>
<html class="dark" lang="vi">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Voice Library - KingCong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/theme.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #a855f7;
            --bg-main: #0a0a0a;
            --bg-secondary: #050505;
            --border: #1a1a1a;
            --text: #e5e5e5;
            --text-dim: #888;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        body {
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #555;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover {
            color: #fff;
        }

        /* Tabs with logos */
        .tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
            padding: 0 16px;
            gap: 8px;
        }

        .lib-tab {
            padding: 10px 16px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }

        .lib-tab:hover {
            color: #ccc;
        }

        .lib-tab.active {
            color: #fff;
            border-bottom: 2px solid var(--primary);
        }

        .lib-tab img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 16px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .info-text {
            font-size: 11px;
            color: #666;
            line-height: 1.6;
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .info-text code {
            background: #1a1a1a;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: monospace;
            color: #fff;
        }

        .btn {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: #fff;
        }

        .btn:hover {
            background: #111;
            border-color: #333;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #fff;
            color: #000;
            border: none;
        }

        .btn-primary:hover {
            background: #e5e5e5;
        }

        .btn-sm {
            padding: 5px 8px;
            font-size: 10px;
        }

        .btn-sm i {
            font-size: 12px;
        }

        .library-content {
            display: none;
        }

        .library-content.active {
            display: block;
        }

        .voice-table {
            width: 100%;
            border-collapse: collapse;
        }

        .voice-table th,
        .voice-table td {
            padding: 8px 6px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            font-size: 11px;
        }

        .voice-table th {
            color: #555;
            font-weight: 500;
            font-size: 9px;
            text-transform: uppercase;
            background: var(--bg-secondary);
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .voice-table input {
            padding: 6px 8px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
        }

        .voice-table input:focus {
            outline: none;
            border-color: #444;
        }

        .voice-table input[type="number"] {
            text-align: center;
        }

        /* Hide spinner buttons on number inputs */
        .voice-table input[type="number"]::-webkit-outer-spin-button,
        .voice-table input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .voice-table input[type="number"] {
            -moz-appearance: textfield;
        }

        .voice-table input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .voice-table select {
            padding: 6px 8px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
        }

        .voice-table select:focus {
            outline: none;
            border-color: #444;
        }

        .voice-table tr:hover td {
            background: var(--bg-main);
        }

        .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #555;
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            display: block;
            margin-bottom: 16px;
        }

        /* Confirm Modal */
        .confirm-modal-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.55);
            z-index: 10000;
            padding: 16px;
        }

        .confirm-modal-content {
            width: min(420px, 92vw);
            background: #000;
            color: #fff;
            border-radius: 12px;
            border: 1px solid #1f1f1f;
            padding: 18px 20px;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.45);
        }

        html.light .confirm-modal-content {
            background: #fff;
            color: #000;
            border-color: #d1d5db;
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.15);
        }

        .confirm-modal-message {
            font-size: 14px;
            line-height: 1.45;
            white-space: pre-line;
            margin-bottom: 16px;
        }

        .confirm-modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .confirm-modal-actions .btn {
            min-width: 96px;
        }

        /* Hidden audio */
        #previewAudio {
            display: none;
        }
    </style>
    <link rel="stylesheet" href="css/theme.css">
</head>

<body>
    <div class="modal-header">
        <h3><i class="bi bi-collection"></i> <span data-i18n="header_title">Voice Library</span></h3>
        <div style="display: flex; align-items: center; gap: 10px;">

            <button class="modal-close" onclick="window.close()">×</button>
        </div>
    </div>

    <!-- Tabs with logos -->
    <div class="tabs">
        <button class="lib-tab active" data-provider="elevenlabs" onclick="switchTab('elevenlabs')">
            <img src="https://avatars.githubusercontent.com/u/94471909?s=280&v=4" alt="">
            <span>ElevenLabs</span>
        </button>
        <button class="lib-tab" data-provider="minimax" onclick="switchTab('minimax')">
            <img src="https://registry.npmmirror.com/@lobehub/icons-static-png/latest/files/dark/minimax-color.png"
                alt="">
            <span>Minimax</span>
        </button>
    </div>

    <div class="modal-body">
        <div class="info-text">
            <span data-i18n="info_text_1">Dùng</span> <code>#1</code> <code>#2</code> <code>#3</code> <span data-i18n="info_text_2">đầu mỗi dòng để dùng voice tương ứng cho hội thoại nhiều người.</span>
        </div>

        <!-- ElevenLabs Library -->
        <div id="elevenlabsLibrary" class="library-content active">
            <table class="voice-table">
                <thead>
                    <tr>
                        <th style="width: 40px;">#</th>
                        <th style="width: 80px;" data-i18n="col_project">Project</th>
                        <th style="min-width: 100px;" data-i18n="col_name">Name</th>
                        <th style="min-width: 160px;" data-i18n="col_voice_id">Voice ID</th>
                        <th style="min-width: 110px;" data-i18n="col_model">Model</th>
                        <th style="width: 60px;" data-i18n="col_speed">Speed</th>
                        <th style="width: 65px;" data-i18n="col_stability">Stability</th>
                        <th style="width: 65px;" data-i18n="col_similarity">Similarity</th>
                        <th style="width: 55px;" data-i18n="col_style">Style</th>
                        <th style="width: 45px;" data-i18n="col_boost">Boost</th>
                        <th style="width: 90px;" data-i18n="col_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="elevenlabsLibraryBody"></tbody>
            </table>
        </div>

        <!-- Minimax Library -->
        <div id="minimaxLibrary" class="library-content">
            <table class="voice-table">
                <thead>
                    <tr>
                        <th style="width: 40px;">#</th>
                        <th style="width: 80px;" data-i18n="col_project">Project</th>
                        <th style="min-width: 100px;" data-i18n="col_name">Name</th>
                        <th style="min-width: 160px;" data-i18n="col_voice_id">Voice ID</th>
                        <th style="min-width: 110px;" data-i18n="col_model">Model</th>
                        <th style="width: 60px;" data-i18n="col_speed">Speed</th>
                        <th style="width: 60px;" data-i18n="col_pitch">Pitch</th>
                        <th style="width: 60px;" data-i18n="col_volume">Volume</th>
                        <th style="width: 90px;" data-i18n="col_actions">Actions</th>
                    </tr>
                </thead>
                <tbody id="minimaxLibraryBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal-footer">
        <button class="btn" onclick="window.close()" data-i18n="btn_cancel">Cancel</button>
        <button class="btn btn-primary" onclick="saveAndClose()"><i class="bi bi-save"></i> <span data-i18n="btn_save">Save</span></button>
    </div>

    <audio id="previewAudio"></audio>

    <!-- Confirm Modal -->
    <div class="confirm-modal-overlay" id="confirmModal" style="display: none;" aria-hidden="true">
        <div class="confirm-modal-content" role="dialog" aria-modal="true">
            <div class="confirm-modal-message" id="confirmModalMessage"></div>
            <div class="confirm-modal-actions">
                <button class="btn" id="confirmCancelBtn" data-i18n="btn_cancel">Hủy</button>
                <button class="btn btn-primary" id="confirmOkBtn" data-i18n="btn_confirm">Xác nhận</button>
            </div>
        </div>
    </div>

    <script>
        let elevenlabsVoices = [];
        let minimaxVoices = [];
        let currentTab = 'elevenlabs';
        let currentLang = localStorage.getItem('app_language') || 'vi'; // Default from app_language
        const previewAudio = document.getElementById('previewAudio');

        // Listen for language changes from main window via IPC
        if (window.electronAPI && window.electronAPI.onLanguageChanged) {
            window.electronAPI.onLanguageChanged((lang) => {
                console.log('🌐 Language synced via IPC:', lang);
                setLanguage(lang);
            });
        }
        
        // Fallback: Storage event
        window.addEventListener('storage', (e) => {
            if (e.key === 'app_language' && e.newValue) {
                console.log('🌐 Language synced via Storage:', e.newValue);
                setLanguage(e.newValue);
            }
        });

        const LANGUAGES = {
            vi: {
                header_title: 'Thư viện giọng nói',
                info_text_1: 'Dùng',
                info_text_2: 'đầu mỗi dòng để dùng voice tương ứng cho hội thoại nhiều người.',
                col_project: 'Dự án',
                col_name: 'Tên',
                col_voice_id: 'Voice ID',
                col_model: 'Mô hình',
                col_speed: 'Tốc độ',
                col_stability: 'Ổn định',
                col_similarity: 'Tương đồng',
                col_style: 'Phong cách',
                col_boost: 'Boost',
                col_pitch: 'Cao độ',
                col_volume: 'Âm lượng',
                col_actions: 'Thao tác',
                btn_cancel: 'Hủy',
                btn_save: 'Lưu',
                btn_confirm: 'Xác nhận',
                placeholder_project: 'Dự án...',
                placeholder_name: 'Tên...',
                placeholder_voice_id: 'Voice ID...',
                empty_state: 'Chưa có voice nào',
                title_preview: 'Nghe thử',
                title_use: 'Sử dụng',
                title_delete: 'Xóa',
                confirm_delete: 'Xóa voice này?',
                alert_no_preview: 'Không có audio mẫu!',
                alert_play_error: 'Không thể phát audio!'
            },
            en: {
                header_title: 'Voice Library',
                info_text_1: 'Use',
                info_text_2: 'at the start of each line to use the corresponding voice for multi-person conversation.',
                col_project: 'Project',
                col_name: 'Name',
                col_voice_id: 'Voice ID',
                col_model: 'Model',
                col_speed: 'Speed',
                col_stability: 'Stability',
                col_similarity: 'Similarity',
                col_style: 'Style',
                col_boost: 'Boost',
                col_pitch: 'Pitch',
                col_volume: 'Volume',
                col_actions: 'Actions',
                btn_cancel: 'Cancel',
                btn_save: 'Save',
                btn_confirm: 'Confirm',
                placeholder_project: 'Project...',
                placeholder_name: 'Name...',
                placeholder_voice_id: 'Voice ID...',
                empty_state: 'No voices found',
                title_preview: 'Preview',
                title_use: 'Use',
                title_delete: 'Delete',
                confirm_delete: 'Delete this voice?',
                alert_no_preview: 'No preview audio available!',
                alert_play_error: 'Cannot play audio!'
            }
        };

        function t(key) {
            return LANGUAGES[currentLang][key] || LANGUAGES['en'][key] || key;
        }

        function setLanguage(lang) {
            currentLang = lang;
            // Removed localStorage.setItem('voiceLibrary_lang', lang) to rely on main app
            // document.getElementById('langSelect').value = lang; // Element removed
            document.documentElement.lang = lang; // Update html lang attribute

            // Update static elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t(key)) el.textContent = t(key);
            });

            // Re-render tables to update placeholders and tooltips
            renderElevenlabsLibrary();
            renderMinimaxLibrary();
        }

        // Models loaded from API (giống như sidebar Pro Tool)
        let loadedModels = {
            elevenlabs: [],
            minimax: []
        };
        let allApiVoices = { elevenlabs: [], minimax: [] };

        async function init() {
            // Load models from API first
            await loadModelsFromAPI();

            // Load ElevenLabs voices
            try {
                elevenlabsVoices = JSON.parse(localStorage.getItem('voiceLibrary_elevenlabs') || '[]');
                if (!Array.isArray(elevenlabsVoices)) elevenlabsVoices = [];
            } catch (e) { elevenlabsVoices = []; }

            // Load Minimax voices
            try {
                minimaxVoices = JSON.parse(localStorage.getItem('voiceLibrary_minimax') || '[]');
                if (!Array.isArray(minimaxVoices)) minimaxVoices = [];
            } catch (e) { minimaxVoices = []; }

            // Load saved language from app_language (priority) or default 'vi'
            const savedLang = localStorage.getItem('app_language') || 'vi';
            setLanguage(savedLang);

            renderElevenlabsLibrary();
            renderMinimaxLibrary();
        }

        async function loadModelsFromAPI() {
            try {
                const res = await window.electronAPI.getResources();
                if (res && res.status === 'success' && res.data) {
                    loadedModels = {
                        elevenlabs: res.data.elevenlabs?.models || [],
                        minimax: res.data.minimax?.models || []
                    };
                    // [Fix] Store all API voices to usage for preview lookup
                    if (res.data.elevenlabs?.voices) allApiVoices.elevenlabs = res.data.elevenlabs.voices;
                    if (res.data.elevenlabs?.shared_voices) allApiVoices.elevenlabs = allApiVoices.elevenlabs.concat(res.data.elevenlabs.shared_voices); // If structure differs

                    if (res.data.minimax?.voices) allApiVoices.minimax = res.data.minimax.voices;

                    console.log('✅ Models & Voices loaded:', {
                        models: loadedModels, voicesCount: {
                            el: allApiVoices.elevenlabs.length,
                            mm: allApiVoices.minimax.length
                        }
                    });
                }
            } catch (error) {
                console.error('❌ Load models error:', error);
                // Fallback models...
                loadedModels = {
                    elevenlabs: [
                        { id: 'eleven_v3', name: 'Eleven V3' },
                        { id: 'eleven_multilingual_v2', name: 'Multilingual V2' },
                        { id: 'eleven_turbo_v2_5', name: 'Turbo V2.5' },
                        { id: 'eleven_turbo_v2', name: 'Turbo V2' },
                        { id: 'eleven_flash_v2_5', name: 'Flash V2.5' },
                        { id: 'eleven_flash_v2', name: 'Flash V2' }
                    ],
                    minimax: [
                        { id: 'speech-02-hd', name: 'Speech HD 2.6' },
                        { id: 'speech-02-turbo', name: 'Speech Turbo 2.6' },
                        { id: 'speech-01-hd', name: 'Speech HD 2.5' },
                        { id: 'speech-01-turbo', name: 'Speech Turbo 2.5' }
                    ]
                };
            }
        }

        function getModelOptions(provider, currentModel) {
            const models = loadedModels[provider] || [];
            if (models.length === 0) {
                // Fallback nếu chưa load được
                if (provider === 'minimax') {
                    return `
                        <option value="speech-02-hd" ${currentModel === 'speech-02-hd' ? 'selected' : ''}>Speech HD 2.6</option>
                        <option value="speech-02-turbo" ${currentModel === 'speech-02-turbo' ? 'selected' : ''}>Speech Turbo 2.6</option>
                        <option value="speech-01-hd" ${currentModel === 'speech-01-hd' ? 'selected' : ''}>Speech HD 2.5</option>
                        <option value="speech-01-turbo" ${currentModel === 'speech-01-turbo' ? 'selected' : ''}>Speech Turbo 2.5</option>
                    `;
                } else {
                    return `
                        <option value="eleven_v3" ${currentModel === 'eleven_v3' ? 'selected' : ''}>Eleven V3</option>
                        <option value="eleven_multilingual_v2" ${currentModel === 'eleven_multilingual_v2' ? 'selected' : ''}>Multilingual V2</option>
                        <option value="eleven_turbo_v2_5" ${currentModel === 'eleven_turbo_v2_5' ? 'selected' : ''}>Turbo V2.5</option>
                        <option value="eleven_turbo_v2" ${currentModel === 'eleven_turbo_v2' ? 'selected' : ''}>Turbo V2</option>
                        <option value="eleven_flash_v2_5" ${currentModel === 'eleven_flash_v2_5' ? 'selected' : ''}>Flash V2.5</option>
                        <option value="eleven_flash_v2" ${currentModel === 'eleven_flash_v2' ? 'selected' : ''}>Flash V2</option>
                    `;
                }
            }
            return models.map(m =>
                `<option value="${m.id}" ${currentModel === m.id ? 'selected' : ''}>${m.name}</option>`
            ).join('');
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.lib-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.provider === tab);
            });
            document.querySelectorAll('.library-content').forEach(content => {
                content.classList.toggle('active', content.id === tab + 'Library');
            });
        }

        function renderElevenlabsLibrary() {
            const tbody = document.getElementById('elevenlabsLibraryBody');

            if (!elevenlabsVoices || elevenlabsVoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11"><div class="empty-state"><i class="bi bi-collection"></i><p>${t('empty_state')}</p></div></td></tr>`;
                return;
            }

            tbody.innerHTML = elevenlabsVoices.map((voice, idx) => {
                const isV3 = voice.model === 'eleven_v3';
                const stabilityValue = voice.settings?.stability || 'natural';

                // V3: Stability dropdown, disable Speed/Similarity/Style
                const stabilityCell = isV3
                    ? `<select style="width: 75px;" onchange="updateElevenlabsSetting(${idx}, 'stability', this.value)">
                           <option value="creative" ${stabilityValue === 'creative' ? 'selected' : ''}>Creative</option>
                           <option value="natural" ${stabilityValue === 'natural' || typeof stabilityValue === 'number' ? 'selected' : ''}>Natural</option>
                           <option value="robust" ${stabilityValue === 'robust' ? 'selected' : ''}>Robust</option>
                       </select>`
                    : `<span style="display:inline-flex;align-items:center;gap:2px;"><input type="number" value="${Math.round((voice.settings?.stability || 0.5) * 100)}" step="5" min="0" max="100" style="width:40px;" onchange="updateElevenlabsSetting(${idx}, 'stability', parseFloat(this.value) / 100)"><span style="font-size:10px;color:#888;">%</span></span>`;

                const disabledStyle = isV3 ? 'opacity: 0.3; pointer-events: none;' : '';
                const similarityPct = Math.round((voice.settings?.similarity || 0.75) * 100);
                const stylePct = Math.round((voice.settings?.style || 0) * 100);

                return `
                <tr data-idx="${idx}">
                    <td>${idx + 1}</td>
                    <td><input type="text" value="${voice.project || ''}" placeholder="${t('placeholder_project')}" style="width: 70px;" onchange="updateElevenlabsVoice(${idx}, 'project', this.value)"></td>
                    <td><input type="text" value="${escapeHtml(voice.voice_name || voice.name || '')}" placeholder="${t('placeholder_name')}" style="width: 90px;" onchange="updateElevenlabsVoice(${idx}, 'name', this.value)"></td>
                    <td><input type="text" value="${voice.voiceId || voice.voice_id || ''}" placeholder="${t('placeholder_voice_id')}" style="width: 140px;" onchange="updateElevenlabsVoice(${idx}, 'voiceId', this.value)"></td>
                    <td>
                        <select style="width: 110px;" onchange="updateElevenlabsVoice(${idx}, 'model', this.value); renderElevenlabsLibrary();">
                            ${getModelOptions('elevenlabs', voice.model || 'eleven_multilingual_v2')}
                        </select>
                    </td>
                    <td style="${disabledStyle}"><input type="number" value="${voice.settings?.speed || 1}" step="0.1" min="0.5" max="2" style="width: 50px;" ${isV3 ? 'disabled' : ''} onchange="updateElevenlabsSetting(${idx}, 'speed', parseFloat(this.value))"></td>
                    <td>${stabilityCell}</td>
                    <td style="${disabledStyle}"><span style="display:inline-flex;align-items:center;gap:2px;"><input type="number" value="${similarityPct}" step="5" min="0" max="100" style="width:40px;" ${isV3 ? 'disabled' : ''} onchange="updateElevenlabsSetting(${idx}, 'similarity', parseFloat(this.value) / 100)"><span style="font-size:10px;color:#888;">%</span></span></td>
                    <td style="${disabledStyle}"><span style="display:inline-flex;align-items:center;gap:2px;"><input type="number" value="${stylePct}" step="5" min="0" max="100" style="width:40px;" ${isV3 ? 'disabled' : ''} onchange="updateElevenlabsSetting(${idx}, 'style', parseFloat(this.value) / 100)"><span style="font-size:10px;color:#888;">%</span></span></td>
                    <td><input type="checkbox" ${voice.settings?.speakerBoost !== false ? 'checked' : ''} onchange="updateElevenlabsSetting(${idx}, 'speakerBoost', this.checked)"></td>
                    <td style="display: flex; gap: 4px; justify-content: center;">
                        <button class="btn btn-sm" onclick="previewVoice('elevenlabs', ${idx})" title="${t('title_preview')}"><i class="bi bi-volume-up"></i></button>
                        <button class="btn btn-sm" onclick="useVoice('elevenlabs', ${idx})" title="${t('title_use')}"><i class="bi bi-check-lg"></i></button>
                        <button class="btn btn-sm" onclick="removeVoice('elevenlabs', ${idx})" title="${t('title_delete')}" style="color: #f55;"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function renderMinimaxLibrary() {
            const tbody = document.getElementById('minimaxLibraryBody');

            if (!minimaxVoices || minimaxVoices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><i class="bi bi-collection"></i><p>${t('empty_state')}</p></div></td></tr>`;
                return;
            }

            tbody.innerHTML = minimaxVoices.map((voice, idx) => {
                // Lấy tên: ưu tiên voice_name > name, tránh trường hợp name = voiceId
                const displayName = voice.voice_name || voice.name || '';
                // Lấy voice ID: ưu tiên voiceId > voice_id > id
                const displayVoiceId = voice.voiceId || voice.voice_id || voice.id || '';
                // Model: default là speech-02-hd nếu không có
                const currentModel = voice.model || 'speech-02-hd';

                return `
                <tr data-idx="${idx}">
                    <td>${idx + 1}</td>
                    <td><input type="text" value="${voice.project || ''}" placeholder="${t('placeholder_project')}" style="width: 70px;" onchange="updateMinimaxVoice(${idx}, 'project', this.value)"></td>
                    <td><input type="text" value="${escapeHtml(displayName)}" placeholder="${t('placeholder_name')}" style="width: 90px;" onchange="updateMinimaxVoice(${idx}, 'name', this.value)"></td>
                    <td><input type="text" value="${displayVoiceId}" placeholder="${t('placeholder_voice_id')}" style="width: 140px;" onchange="updateMinimaxVoice(${idx}, 'voiceId', this.value)"></td>
                    <td>
                        <select style="width: 100px;" onchange="updateMinimaxVoice(${idx}, 'model', this.value)">
                            ${getModelOptions('minimax', currentModel)}
                        </select>
                    </td>
                    <td><input type="number" value="${(voice.settings?.speed || 1).toFixed(2)}" step="0.01" min="0.5" max="2" style="width: 55px;" onchange="updateMinimaxSetting(${idx}, 'speed', parseFloat(this.value))"></td>
                    <td><input type="number" value="${voice.settings?.pitch || 0}" step="1" min="-12" max="12" style="width: 50px;" onchange="updateMinimaxSetting(${idx}, 'pitch', parseFloat(this.value))"></td>
                    <td><input type="number" value="${(voice.settings?.vol || 1).toFixed(2)}" step="0.01" min="0.1" max="10" style="width: 55px;" onchange="updateMinimaxSetting(${idx}, 'vol', parseFloat(this.value))"></td>
                    <td style="display: flex; gap: 4px;">
                        <button class="btn btn-sm" onclick="previewVoice('minimax', ${idx})" title="${t('title_preview')}"><i class="bi bi-volume-up"></i></button>
                        <button class="btn btn-sm" onclick="useVoice('minimax', ${idx})" title="${t('title_use')}"><i class="bi bi-check-lg"></i></button>
                        <button class="btn btn-sm" onclick="removeVoice('minimax', ${idx})" title="${t('title_delete')}" style="color: #f55;"><i class="bi bi-trash"></i></button>
                    </td>
                </tr>`;
            }).join('');
        }

        function updateElevenlabsVoice(idx, field, value) {
            if (elevenlabsVoices[idx]) elevenlabsVoices[idx][field] = value;
        }

        function updateElevenlabsSetting(idx, field, value) {
            if (elevenlabsVoices[idx]) {
                if (!elevenlabsVoices[idx].settings) elevenlabsVoices[idx].settings = {};
                elevenlabsVoices[idx].settings[field] = value;
            }
        }

        function updateMinimaxVoice(idx, field, value) {
            if (minimaxVoices[idx]) minimaxVoices[idx][field] = value;
        }

        function updateMinimaxSetting(idx, field, value) {
            if (minimaxVoices[idx]) {
                if (!minimaxVoices[idx].settings) minimaxVoices[idx].settings = {};
                minimaxVoices[idx].settings[field] = value;
            }
        }

        async function previewVoice(provider, idx) {
            const voices = provider === 'elevenlabs' ? elevenlabsVoices : minimaxVoices;
            const voice = voices[idx];
            if (!voice) return;

            let previewUrl = voice.preview_url || '';

            // [Fix] Minimax uses voice_id or id, not always voiceId
            const dbVoiceId = voice.voiceId || voice.voice_id || voice.id;

            // 1. Try to find in allApiVoices (Loaded from getResources)
            if (!previewUrl && dbVoiceId && allApiVoices[provider]) {
                const foundApiVoice = allApiVoices[provider].find(v => (v.voice_id == dbVoiceId || v.id == dbVoiceId));
                if (foundApiVoice) {
                    previewUrl = foundApiVoice.preview_url || foundApiVoice.sample_audio || '';
                    if (previewUrl) {
                        // console.log('✅ Found preview in Cache:', previewUrl);
                        voice.preview_url = previewUrl;
                    }
                }
            }

            // 2. Fallback to API Search if not found
            if (!previewUrl && dbVoiceId) {
                try {
                    const res = await window.electronAPI.apiRequest(
                        'https://kingcongstudio.com/ajaxs/get_resources3.php?action=search_voice_id',
                        { voice_id: dbVoiceId }
                    );

                    if (res && res.status === 'success' && res.data) {
                        previewUrl = res.data.preview_url || res.data.sample_audio || '';
                        if (previewUrl) {
                            voice.preview_url = previewUrl;

                            // Save to local storage
                            if (provider === 'elevenlabs') {
                                localStorage.setItem('voiceLibrary_elevenlabs', JSON.stringify(elevenlabsVoices));
                            } else {
                                localStorage.setItem('voiceLibrary_minimax', JSON.stringify(minimaxVoices));
                            }
                        }
                    }
                } catch (e) {
                    console.error('❌ API Error:', e);
                }
            }
        }

        async function playPreview(provider, idx) {
            const voices = provider === 'elevenlabs' ? elevenlabsVoices : minimaxVoices;
            const voice = voices[idx];
            
            if (!voice) return;
            
            // Check for previewUrl
            let previewUrl = voice.previewUrl || voice.preview_url;
            
            // If checking API map
            if (!previewUrl && provider === 'elevenlabs') {
                 // Try to look up in allApiVoices
                 const apiVoice = allApiVoices.elevenlabs.find(v => v.voice_id === voice.voiceId);
                 if (apiVoice) previewUrl = apiVoice.preview_url;
            } else if (!previewUrl && provider === 'minimax') {
                 // Try to look up in allApiVoices.minimax logic if accessible
            }

            // DB fallback
            if (!previewUrl) {
                // Try from local DB (voice.preview_url might be saved)
                // For now, if no url, alert
                const dbVoiceId = voice.voiceId;

                console.warn('❌ Could not find preview for:', dbVoiceId);
                alert(t('alert_no_preview') + ' (ID: ' + dbVoiceId + ')');
                return;
            }

            if (previewAudio.src === previewUrl && !previewAudio.paused) {
                previewAudio.pause();
            } else {
                previewAudio.src = previewUrl;
                previewAudio.play().catch(e => alert(t('alert_play_error')));
            }
        }

        function useVoice(provider, idx) {
            const voices = provider === 'elevenlabs' ? elevenlabsVoices : minimaxVoices;
            const voice = voices[idx];
            if (!voice || !voice.voiceId) return;

            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({ type: 'useVoiceFromLibrary', voice: voice }, '*');
            }

            if (window.electronAPI && window.electronAPI.sendVoiceLibrary) {
                window.electronAPI.sendVoiceLibrary({ action: 'use', voice: voice });
            }
        }

        function removeVoice(provider, idx) {
            openConfirmModal(t('confirm_delete'), () => {
                if (provider === 'elevenlabs') {
                    elevenlabsVoices.splice(idx, 1);
                    renderElevenlabsLibrary();
                } else {
                    minimaxVoices.splice(idx, 1);
                    renderMinimaxLibrary();
                }
            });
        }

        function saveAndClose() {
            localStorage.setItem('voiceLibrary_elevenlabs', JSON.stringify(elevenlabsVoices));
            localStorage.setItem('voiceLibrary_minimax', JSON.stringify(minimaxVoices));

            if (window.opener && !window.opener.closed) {
                window.opener.postMessage({
                    type: 'voiceLibraryUpdated',
                    elevenlabs: elevenlabsVoices,
                    minimax: minimaxVoices
                }, '*');
            }

            if (window.electronAPI && window.electronAPI.sendVoiceLibrary) {
                window.electronAPI.sendVoiceLibrary({
                    elevenlabs: elevenlabsVoices,
                    minimax: minimaxVoices
                });
            }

            window.close();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        let confirmModalCallback = null;
        let confirmModalInitialized = false;

        function initConfirmModal() {
            if (confirmModalInitialized) return;
            const overlay = document.getElementById('confirmModal');
            const cancelBtn = document.getElementById('confirmCancelBtn');
            const confirmBtn = document.getElementById('confirmOkBtn');

            if (!overlay || !cancelBtn || !confirmBtn) return;

            confirmModalInitialized = true;

            cancelBtn.addEventListener('click', () => closeConfirmModal());
            confirmBtn.addEventListener('click', () => {
                const callback = confirmModalCallback;
                closeConfirmModal();
                if (typeof callback === 'function') callback();
            });

            overlay.addEventListener('click', (event) => {
                if (event.target === overlay) {
                    closeConfirmModal();
                }
            });

            document.addEventListener('keydown', (event) => {
                if (event.key === 'Escape' && overlay.style.display === 'flex') {
                    closeConfirmModal();
                }
            });
        }

        function openConfirmModal(message, onConfirm) {
            initConfirmModal();
            const overlay = document.getElementById('confirmModal');
            const messageEl = document.getElementById('confirmModalMessage');
            if (!overlay || !messageEl) return;

            confirmModalCallback = onConfirm;
            messageEl.textContent = message || '';
            overlay.style.display = 'flex';
            overlay.setAttribute('aria-hidden', 'false');
        }

        function closeConfirmModal() {
            const overlay = document.getElementById('confirmModal');
            if (!overlay) return;
            overlay.style.display = 'none';
            overlay.setAttribute('aria-hidden', 'true');
            confirmModalCallback = null;
        }

        // Listen for voice library updates
        if (window.electronAPI && window.electronAPI.onVoiceLibraryUpdated) {
            window.electronAPI.onVoiceLibraryUpdated((data) => {
                if (data.action === 'added' && data.voice) {
                    if (data.provider === 'elevenlabs') {
                        elevenlabsVoices.push(data.voice);
                        renderElevenlabsLibrary();
                    } else if (data.provider === 'minimax') {
                        minimaxVoices.push(data.voice);
                        renderMinimaxLibrary();
                    }
                }
            });
        }

        init();
        initConfirmModal();
    </script>
</body>

</html>
