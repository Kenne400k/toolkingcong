<!DOCTYPE html>
<html class="dark" lang="vi">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Chọn Giọng Nói - KingCong</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="js/theme.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #a855f7;
            --bg-main: #0a0a0a;
            --bg-secondary: #050505;
            --border: #1a1a1a;
            --text: #e5e5e5;
            --text-dim: #888;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        body {
            background: var(--bg-main);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-header h3 {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-header h3 img {
            width: 20px;
            height: 20px;
            border-radius: 4px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #555;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
        }

        .modal-close:hover { color: #fff; }

        /* Tabs */
        .voice-tabs {
            display: flex;
            border-bottom: 1px solid #2a2a2a;
            padding: 0 16px;
        }

        .voice-tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
            font-size: 13px;
        }

        .voice-tab:hover { color: #ccc; }

        .voice-tab.active {
            color: #fff;
            border-bottom: 2px solid var(--primary);
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        .form-input {
            width: 100%;
            padding: 10px 12px;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .form-input:focus { border-color: #333; }

        .btn {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            color: #fff;
        }

        .btn:hover { background: #111; border-color: #333; }
        .btn:active { transform: scale(0.98); }
        .btn-primary { background: #fff; color: #000; border: none; }
        .btn-primary:hover { background: #e5e5e5; }
        .btn-sm { padding: 6px 10px; font-size: 11px; }

        .voice-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
        }

        .voice-item:hover { background: #1a1a1a; }

        .voice-item .info {
            flex: 1;
            min-width: 0;
        }

        .voice-item .name {
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }

        .voice-item .id {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        .voice-item .labels {
            font-size: 10px;
            color: #666;
            margin-top: 4px;
        }

        .voice-item .actions {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .count-info {
            font-size: 12px;
            color: #666;
            margin-bottom: 10px;
        }

        .voice-list {
            max-height: calc(100vh - 260px);
            overflow-y: auto;
        }

        .loading, .empty-state {
            text-align: center;
            padding: 60px 40px;
            color: #555;
        }

        .empty-state i {
            font-size: 48px;
            opacity: 0.3;
            display: block;
            margin-bottom: 16px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid #333;
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #previewAudio { display: none; }
    </style>
    <link rel="stylesheet" href="css/theme.css">
</head>

<body class="force-dark">
    <div class="modal-header">
        <h3>
            <img id="providerLogo" src="https://avatars.githubusercontent.com/u/94471909?s=280&v=4" alt="">
            <i class="bi bi-mic"></i> <span id="titleText" data-i18n="title_select_voice">Chọn Giọng Nói</span>
        </h3>
        <button class="modal-close" onclick="window.close()">×</button>
    </div>

    <!-- Tabs -->
    <div class="voice-tabs">
        <button class="voice-tab active" data-tab="default" onclick="switchTab('default')">
            <i class="bi bi-cloud-download"></i> <span data-i18n="tab_default">Mặc định</span>
        </button>
        <button class="voice-tab" data-tab="library" onclick="switchTab('library')">
            <i class="bi bi-collection"></i> <span data-i18n="tab_library">Thư viện</span>
        </button>
    </div>

    <div class="modal-body">
        <div style="margin-bottom: 12px;">
        <div style="margin-bottom: 12px;">
            <input type="text" class="form-input" id="voiceSearch" placeholder="Tìm kiếm voice..." data-i18n-placeholder="search_placeholder" oninput="filterVoices(this.value)">
        </div>
        </div>
        <div id="countInfo" class="count-info"></div>
        <div class="voice-list" id="voicesList">
            <div class="loading">
                <div class="spinner"></div>
                <span data-i18n="loading_voices">Loading voices...</span>
            </div>
        </div>
    </div>

    <div class="modal-footer">
    <div class="modal-footer">
        <button class="btn" onclick="window.close()" data-i18n="btn_close">Close</button>
    </div>

    <audio id="previewAudio"></audio>

    <script>
        let allVoices = [];
        let sharedVoices = [];
        let currentProvider = 'elevenlabs';
        let currentTab = 'default';
        let currentLang = localStorage.getItem('app_language') || 'vi';
        const previewAudio = document.getElementById('previewAudio');

        const LANGUAGES = {
            vi: {
                title_select_voice: 'Chọn Giọng Nói',
                tab_default: 'Mặc định',
                tab_library: 'Thư viện',
                search_placeholder: 'Tìm kiếm voice...',
                loading_voices: 'Đang tải danh sách giọng...',
                btn_close: 'Đóng',
                count_voices: 'giọng',
                count_shared_voices: 'giọng chia sẻ',
                empty_state: 'Không có voices',
                empty_state_shared: 'Không có shared voices',
                error_load: 'Không thể tải voices',
                error_prefix: 'Lỗi:',
                unknown: 'Unknown',
                btn_select: 'Chọn',
                btn_preview: 'Nghe thử',
                no_results: 'Không tìm thấy voice'
            },
            en: {
                title_select_voice: 'Select Voice',
                tab_default: 'Default',
                tab_library: 'Library',
                search_placeholder: 'Search voices...',
                loading_voices: 'Loading voices...',
                btn_close: 'Close',
                count_voices: 'voices',
                count_shared_voices: 'shared voices',
                empty_state: 'No voices found',
                empty_state_shared: 'No shared voices found',
                error_load: 'Cannot load voices',
                error_prefix: 'Error:',
                unknown: 'Unknown',
                btn_select: 'Select',
                btn_preview: 'Preview',
                no_results: 'No voices found'
            }
        };

        function t(key) {
            return LANGUAGES[currentLang][key] || LANGUAGES['en'][key] || key;
        }

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.lang = lang;
            
            // Update static elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t(key)) el.textContent = t(key);
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t(key)) el.placeholder = t(key);
            });

            // Re-render lists if they have data (to update dynamic texts like buttons)
            if (currentTab === 'default' && allVoices.length > 0) renderVoices(allVoices);
            if (currentTab === 'library' && sharedVoices.length > 0) renderSharedVoices(sharedVoices);
        }

        // Listen for language changes
        if (window.electronAPI && window.electronAPI.onLanguageChanged) {
            window.electronAPI.onLanguageChanged((lang) => setLanguage(lang));
        }
        window.addEventListener('storage', (e) => {
            if (e.key === 'app_language' && e.newValue) setLanguage(e.newValue);
        });

        const PROVIDER_LOGOS = {
            elevenlabs: 'https://avatars.githubusercontent.com/u/94471909?s=280&v=4',
            minimax: 'https://registry.npmmirror.com/@lobehub/icons-static-png/latest/files/dark/minimax-color.png'
        };

        const FLAG_MAP = {
            'en': '🇺🇸', 'vi': '🇻🇳', 'fr': '🇫🇷', 'de': '🇩🇪', 'es': '🇪🇸',
            'it': '🇮🇹', 'pt': '🇵🇹', 'ru': '🇷🇺', 'ja': '🇯🇵', 'ko': '🇰🇷',
            'zh': '🇨🇳', 'ar': '🇸🇦', 'hi': '🇮🇳', 'th': '🇹🇭', 'id': '🇮🇩'
        };

        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.voice-tab').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            if (tab === 'default') {
                renderVoices(allVoices);
            } else if (tab === 'library') {
                loadSharedVoices();
            }
        }

        async function init() {
            // Set initial language
            const savedLang = localStorage.getItem('app_language') || 'vi';
            setLanguage(savedLang);

            currentProvider = getQueryParam('provider') || 'elevenlabs';
            document.getElementById('providerLogo').src = PROVIDER_LOGOS[currentProvider] || PROVIDER_LOGOS.elevenlabs;

            // Hide library tab for non-elevenlabs providers
            const libraryTab = document.querySelector('.voice-tab[data-tab="library"]');
            if (currentProvider !== 'elevenlabs') {
                libraryTab.style.display = 'none';
            }

            // Load default voices
            await loadDefaultVoices();
        }

        async function loadDefaultVoices() {
            document.getElementById('voicesList').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    ${t('loading_voices')}
                </div>
            `;

            try {
                const res = await window.electronAPI.getResources();
                if (res && res.status === 'success' && res.data) {
                    allVoices = res.data[currentProvider]?.voices || [];
                    renderVoices(allVoices);
                } else {
                    document.getElementById('voicesList').innerHTML = `<div class="loading">${t('error_load')}</div>`;
                }
            } catch (error) {
                document.getElementById('voicesList').innerHTML = `<div class="loading">${t('error_prefix')} ${error.message}</div>`;
            }
        }

        async function loadSharedVoices() {
            document.getElementById('voicesList').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    ${t('loading_voices')}
                </div>
            `;

            try {
                const res = await window.electronAPI.apiRequest(
                    'https://kingcongstudio.com/ajaxs/get_voices.php?v=' + Date.now(),
                    {}
                );

                if (res && res.status === 'success' && res.data && res.data.length > 0) {
                    sharedVoices = res.data;
                    renderSharedVoices(sharedVoices);
                } else {
                    document.getElementById('countInfo').textContent = '';
                    document.getElementById('voicesList').innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-collection"></i>
                            <p>${t('empty_state_shared')}</p>
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Load shared voices error:', error);
                document.getElementById('voicesList').innerHTML = `<div class="loading">${t('error_prefix')} ${error.message}</div>`;
            }
        }

        function renderSharedVoices(voices) {
            document.getElementById('countInfo').textContent = `${voices.length} ${t('count_shared_voices')}`;
            document.getElementById('voicesList').innerHTML = voices.map(voice => {
                const voiceId = voice.voice_id || voice.id;
                const voiceName = escapeHtml(voice.name || 'Unknown');
                const previewUrl = (voice.preview_url || '').replace(/'/g, "\\'");
                const desc = escapeHtml(voice.description || '');
                const langCode = (voice.language || 'en').split('-')[0].toLowerCase();
                const flag = FLAG_MAP[langCode] || '🌐';
                const usage = voice.usage_1y ? formatMetric(voice.usage_1y) : '';
                const cloned = voice.cloned ? formatMetric(voice.cloned) : '';

                return `
                <div class="voice-item" onclick="selectVoice('${voiceId}', '${escapeAttr(voice.name)}')">
                    <div class="info">
                        <div class="name">${flag} ${voiceName}</div>
                        <div class="id">${voiceId}</div>
                        <div class="labels">
                            ${desc ? `<span>${desc.substring(0, 50)}${desc.length > 50 ? '...' : ''}</span>` : ''}
                            ${usage ? `<span style="margin-left: 8px;"><i class="bi bi-lightning-charge-fill"></i> ${usage}</span>` : ''}
                            ${cloned ? `<span style="margin-left: 8px;"><i class="bi bi-people-fill"></i> ${cloned}</span>` : ''}
                        </div>
                    </div>
                    <div class="actions">
                        ${previewUrl ? `<button class="btn btn-sm" onclick="event.stopPropagation(); togglePreview('${previewUrl}')" title="${t('btn_preview')}"><i class="bi bi-volume-up"></i></button>` : ''}
                        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); selectVoice('${voiceId}', '${escapeAttr(voice.name)}')">${t('btn_select')}</button>
                    </div>
                </div>`;
            }).join('');
        }

        function formatMetric(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function renderVoices(voices) {
            document.getElementById('countInfo').textContent = `${voices.length} ${t('count_voices')}`;

            if (!voices || voices.length === 0) {
                document.getElementById('voicesList').innerHTML = `<div class="loading">${t('empty_state')}</div>`;
                return;
            }

            document.getElementById('voicesList').innerHTML = voices.map(voice => {
                const voiceId = voice.voice_id || voice.id;
                // Ưu tiên voice_name trước, sau đó name (tránh trường hợp name = voice_id)
                const voiceName = escapeHtml(voice.voice_name || voice.name || t('unknown'));
                const previewUrl = (voice.preview_url || voice.sample_audio || '').replace(/'/g, "\\'");
                const labels = voice.labels ? Object.values(voice.labels).join(' • ') : '';

                return `
                <div class="voice-item" onclick="selectVoice('${voiceId}', '${escapeAttr(voice.voice_name || voice.name)}')">
                    <div class="info">
                        <div class="name">${voiceName}</div>
                        <div class="id">${voiceId}</div>
                        ${labels ? `<div class="labels">${escapeHtml(labels)}</div>` : ''}
                    </div>
                    <div class="actions">
                        ${previewUrl ? `<button class="btn btn-sm" onclick="event.stopPropagation(); togglePreview('${previewUrl}')" title="${t('btn_preview')}"><i class="bi bi-volume-up"></i></button>` : ''}
                        <button class="btn btn-sm btn-primary" onclick="event.stopPropagation(); selectVoice('${voiceId}', '${escapeAttr(voice.voice_name || voice.name)}')">${t('btn_select')}</button>
                    </div>
                </div>`;
            }).join('');
        }

        function filterVoices(query) {
            query = query.toLowerCase();
            const voices = currentTab === 'library' ? sharedVoices : allVoices;
            const filtered = voices.filter(v => {
                const name = (v.name || '').toLowerCase();
                const id = (v.voice_id || v.voiceId || v.id || '').toLowerCase();
                const desc = (v.description || '').toLowerCase();
                return name.includes(query) || id.includes(query) || desc.includes(query);
            });

            if (currentTab === 'library') {
                if (filtered.length === 0) {
                    document.getElementById('voicesList').innerHTML = `<div class="empty-state"><p>${t('no_results')}</p></div>`;
                    document.getElementById('countInfo').textContent = `0 ${t('count_voices')}`;
                    return;
                }
                renderSharedVoices(filtered);
            } else {
                renderVoices(filtered);
            }
        }

        function togglePreview(url) {
            if (!url) return;
            if (previewAudio.src === url && !previewAudio.paused) {
                previewAudio.pause();
            } else {
                previewAudio.src = url;
                previewAudio.play().catch(e => console.error('Play error:', e));
            }
        }

        async function selectVoice(voiceId, voiceName) {
            if (window.electronAPI && window.electronAPI.selectVoiceFromWindow) {
                // Gửi cả voiceId và voiceName để lưu vào Pro Tool
                await window.electronAPI.selectVoiceFromWindow(voiceId, voiceName);
            }
            setTimeout(() => window.close(), 300);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function escapeAttr(text) {
            return (text || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }

        window.addEventListener('beforeunload', () => previewAudio?.pause());
        init();
    </script>
</body>
</html>
