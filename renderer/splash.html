<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KingCong Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .splash-container {
            width: 100%;
            max-width: 420px;
            text-align: center;
            padding: 40px;
        }

        /* Logo */
        .logo-wrapper {
            margin-bottom: 30px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 20px;
            border: 3px solid #333;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.2);
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #fff 0%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .brand-tagline {
            font-size: 14px;
            color: #666;
        }

        /* Status */
        .status-container {
            margin: 40px 0;
        }

        .status-icon {
            font-size: 32px;
            margin-bottom: 16px;
            color: #667eea;
        }

        .status-icon.spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .status-text {
            font-size: 15px;
            color: #ccc;
            margin-bottom: 8px;
        }

        .status-detail {
            font-size: 12px;
            color: #666;
        }

        /* Progress Bar */
        .progress-container {
            margin-top: 24px;
            display: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .progress-text {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        /* Version Info */
        .version-info {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #222;
        }

        .version-text {
            font-size: 12px;
            color: #444;
        }

        .version-number {
            color: #667eea;
            font-weight: 600;
        }

        /* Update Available */
        .update-available {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
        }

        .update-title {
            font-size: 14px;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 8px;
        }

        .update-version {
            font-size: 13px;
            color: #888;
            margin-bottom: 12px;
        }

        .btn-update {
            padding: 10px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-update:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-skip {
            padding: 10px 24px;
            background: transparent;
            color: #666;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            margin-left: 8px;
            transition: all 0.3s;
        }

        .btn-skip:hover {
            border-color: #555;
            color: #888;
        }

        /* Error State */
        .error-state {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
        }

        .error-icon {
            font-size: 24px;
            color: #ef4444;
            margin-bottom: 8px;
        }

        .error-text {
            font-size: 13px;
            color: #ef4444;
            margin-bottom: 12px;
        }

        .btn-retry {
            padding: 8px 20px;
            background: #ef4444;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .btn-continue {
            padding: 8px 20px;
            background: transparent;
            color: #888;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            margin-left: 8px;
        }

        /* Changelog */
        .changelog {
            margin-top: 12px;
            padding: 12px;
            background: #0a0a0a;
            border-radius: 8px;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
        }

        .changelog-title {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .changelog-item {
            font-size: 12px;
            color: #888;
            padding: 4px 0;
            padding-left: 12px;
            position: relative;
        }

        .changelog-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 10px;
            width: 4px;
            height: 4px;
            background: #667eea;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <!-- Logo Section -->
        <div class="logo-wrapper">
            <img src="../image/Kingcong.jpg" alt="KingCong" class="logo" id="logo">
            <div class="brand-name">KingCong Studio</div>
            <div class="brand-tagline">Text-to-Speech Professional Tool</div>
        </div>

        <!-- Status Section -->
        <div class="status-container">
            <div class="status-icon spin" id="statusIcon">
                <i class="bi bi-arrow-repeat"></i>
            </div>
            <div class="status-text" id="statusText">Checking for updates...</div>
            <div class="status-detail" id="statusDetail">Please wait</div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- Update Available -->
        <div class="update-available" id="updateAvailable">
            <div class="update-title">
                <i class="bi bi-download"></i> Update Available
            </div>
            <div class="update-version" id="updateVersion">Version 1.0.1</div>
            <div class="changelog" id="changelog">
                <div class="changelog-title">What's New</div>
                <div class="changelog-item">Bug fixes and improvements</div>
            </div>
            <div style="margin-top: 16px;">
                <button class="btn-update" onclick="startUpdate()">
                    <i class="bi bi-download"></i> Update Now
                </button>
                <button class="btn-skip" onclick="skipUpdate()">Skip</button>
            </div>
        </div>

        <!-- Error State -->
        <div class="error-state" id="errorState">
            <div class="error-icon"><i class="bi bi-exclamation-circle"></i></div>
            <div class="error-text" id="errorText">Could not check for updates</div>
            <button class="btn-retry" onclick="retryCheck()">Retry</button>
            <button class="btn-continue" onclick="continueToApp()">Continue</button>
        </div>

        <!-- Version Info -->
        <div class="version-info">
            <div class="version-text">
                Version <span class="version-number" id="currentVersion">1.0.0</span>
            </div>
        </div>
    </div>

    <script>
        // Get version from main process
        let currentVersion = '1.0.0';
        let updateInfo = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Get current version
                if (window.electronAPI && window.electronAPI.getVersion) {
                    currentVersion = await window.electronAPI.getVersion();
                    document.getElementById('currentVersion').textContent = currentVersion;
                }

                // Start update check
                checkForUpdates();
            } catch (error) {
                console.error('Init error:', error);
                showError('Initialization failed');
            }
        });

        async function checkForUpdates() {
            setStatus('checking', 'Checking for updates...', 'Connecting to server');

            try {
                if (window.electronAPI && window.electronAPI.checkForUpdates) {
                    const result = await window.electronAPI.checkForUpdates();

                    if (result.updateAvailable) {
                        updateInfo = result;
                        showUpdateAvailable(result);
                    } else {
                        setStatus('success', 'You\'re up to date!', 'Launching application...');
                        setTimeout(() => continueToApp(), 1500);
                    }
                } else {
                    // No API available, continue to app
                    setStatus('success', 'Ready', 'Launching application...');
                    setTimeout(() => continueToApp(), 1000);
                }
            } catch (error) {
                console.error('Update check error:', error);
                showError('Could not check for updates: ' + error.message);
            }
        }

        function setStatus(type, text, detail) {
            const statusIcon = document.getElementById('statusIcon');
            const statusText = document.getElementById('statusText');
            const statusDetail = document.getElementById('statusDetail');

            statusText.textContent = text;
            statusDetail.textContent = detail;

            if (type === 'checking') {
                statusIcon.innerHTML = '<i class="bi bi-arrow-repeat"></i>';
                statusIcon.classList.add('spin');
            } else if (type === 'success') {
                statusIcon.innerHTML = '<i class="bi bi-check-circle"></i>';
                statusIcon.classList.remove('spin');
                statusIcon.style.color = '#22c55e';
            } else if (type === 'downloading') {
                statusIcon.innerHTML = '<i class="bi bi-cloud-download"></i>';
                statusIcon.classList.add('spin');
                statusIcon.style.color = '#667eea';
            } else if (type === 'error') {
                statusIcon.innerHTML = '<i class="bi bi-exclamation-circle"></i>';
                statusIcon.classList.remove('spin');
                statusIcon.style.color = '#ef4444';
            }
        }

        function showUpdateAvailable(info) {
            setStatus('success', 'Update available!', `New version: ${info.version}`);

            document.getElementById('updateAvailable').style.display = 'block';
            document.getElementById('updateVersion').textContent = `Version ${info.version}`;

            // Show changelog
            if (info.changelog && info.changelog.length > 0) {
                const changelogEl = document.getElementById('changelog');
                changelogEl.innerHTML = '<div class="changelog-title">What\'s New</div>' +
                    info.changelog.map(item => `<div class="changelog-item">${item}</div>`).join('');
            }
        }

        function showError(message) {
            setStatus('error', 'Error', message);
            document.getElementById('errorState').style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        async function startUpdate() {
            if (!updateInfo) return;

            document.getElementById('updateAvailable').style.display = 'none';
            document.getElementById('progressContainer').style.display = 'block';
            setStatus('downloading', 'Downloading update...', '0%');

            try {
                if (window.electronAPI && window.electronAPI.downloadUpdate) {
                    await window.electronAPI.downloadUpdate(updateInfo);
                }
            } catch (error) {
                console.error('Download error:', error);
                showError('Download failed: ' + error.message);
            }
        }

        function skipUpdate() {
            continueToApp();
        }

        function retryCheck() {
            document.getElementById('errorState').style.display = 'none';
            checkForUpdates();
        }

        async function continueToApp() {
            setStatus('success', 'Launching...', 'Please wait');

            if (window.electronAPI && window.electronAPI.finishSplash) {
                await window.electronAPI.finishSplash();
            }
        }

        // Listen for download progress
        if (window.electronAPI && window.electronAPI.onUpdateProgress) {
            window.electronAPI.onUpdateProgress((progress) => {
                document.getElementById('progressFill').style.width = progress.percent + '%';
                document.getElementById('progressText').textContent = progress.percent + '%';
                document.getElementById('statusDetail').textContent =
                    `${formatBytes(progress.transferred)} / ${formatBytes(progress.total)}`;
            });
        }

        // Listen for update complete
        if (window.electronAPI && window.electronAPI.onUpdateComplete) {
            window.electronAPI.onUpdateComplete((success) => {
                if (success) {
                    setStatus('success', 'Update complete!', 'Restarting...');
                } else {
                    showError('Update installation failed');
                }
            });
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }
    </script>
</body>
</html>
